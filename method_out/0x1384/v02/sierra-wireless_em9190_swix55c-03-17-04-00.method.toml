version = 2
cond = "sky-fix"
modem_make = "Sierra"
modem_model = "EM9190"
modem_firmware = "SWIX55C_03.17.04.00"

[[field_map]]
parser_field = "nmea_sentence"
quantity = "gnss_nmea_sentence_raw"
sources = [
    { kind = "nmea", value = "EM9190 NMEA-port sentence (same type + utc_time)" },
]

[[field_map]]
parser_field = "parsed.latitude"
quantity = "gnss_latitude_deg"
sources = [
    { kind = "at", value = "AT!GPSLOC?" },
]

[[field_map]]
parser_field = "parsed.longitude"
quantity = "gnss_longitude_deg"
sources = [
    { kind = "at", value = "AT!GPSLOC?" },
]

[[field_map]]
parser_field = "parsed.altitude_m"
quantity = "gnss_altitude_m"
sources = [
    { kind = "at", value = "AT!GPSLOC?" },
]

[[field_map]]
parser_field = "parsed.num_satellites"
quantity = "gnss_num_satellites_used"
sources = [
    { kind = "at", value = "AT!GPSSATINFO?" },
]

[[field_map]]
parser_field = "parsed.fix_quality"
quantity = "gnss_fix_quality_indicator"
sources = [
    { kind = "at", value = "AT!GPSLOC?" },
    { kind = "at", value = "AT!GPSSTATUS?" },
]

[[field_map]]
parser_field = "client_id"
quantity = "gnss_firmware_client_magic"
sources = [
    { kind = "trigger", value = "modem-identity: Sierra ⇒ 0x00000DA3" },
]
