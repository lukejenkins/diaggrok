version = 2
cond = "sky-fix"
modem_make = "Quectel"
modem_model = "RM520N-GL"
modem_firmware = "RM520NGLAAR03A03M4G"

[[field_map]]
parser_field = "nmea_sentence"
quantity = "gnss_nmea_sentence"
sources = [
    { kind = "at", value = "AT+QGPSGNMEA=\"GGA\"" },
    { kind = "at", value = "AT+QGPSGNMEA=\"RMC\"" },
]

[[field_map]]
parser_field = "parsed.latitude"
quantity = "gnss_latitude_deg"
sources = [
    { kind = "at", value = "AT+QGPSLOC=2" },
]

[[field_map]]
parser_field = "parsed.longitude"
quantity = "gnss_longitude_deg"
sources = [
    { kind = "at", value = "AT+QGPSLOC=2" },
]

[[field_map]]
parser_field = "parsed.altitude_m"
quantity = "gnss_altitude_msl_m"
sources = [
    { kind = "at", value = "AT+QGPSLOC=2" },
]

[[field_map]]
parser_field = "parsed.num_satellites"
quantity = "gnss_sv_used_count"
sources = [
    { kind = "at", value = "AT+QGPSLOC=2" },
]

[[field_map]]
parser_field = "parsed.fix_quality"
quantity = "gnss_fix_quality_indicator"
sources = [
    { kind = "at", value = "AT+QGPSLOC=2" },
]

[[field_map]]
parser_field = "client_id"
quantity = "gnss_firmware_client_magic"
sources = [
    { kind = "trigger", value = "modem-identity: constant across the RM520N-GL capture" },
]
