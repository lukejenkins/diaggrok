version = 2
cond = "sky-fix"
modem_make = "Compal"
modem_model = "RXM-G1"
modem_firmware = "RXMG1.20.00.244_0C03"

[[field_map]]
parser_field = "nmea_sentence"
quantity = "gnss_nmea_sentence_raw"
status = "verified"

[[field_map.sources]]
kind = "trigger"
value = "AT+BGPS=1 then AT+BNMEA=1 (CEI-proprietary GNSS engine + NMEA stream on if2 DUN AT port)"

[[field_map.sources]]
kind = "nmea"
value = "$PQWP2 / $PQWM1 proprietary sentence on the RXM-G1 if2 AT port (same epoch, byte-compare)"

[[field_map.sources]]
kind = "f3"
value = "locPd_ExtEventCb: Received best available position (co-captured QSR4 F3, qdb 77c0963a) — fix epoch anchor for the position sentence"

[[field_map]]
parser_field = "fix_quality"
quantity = "gnss_fix_quality_indicator"

[[field_map.sources]]
kind = "nmea"
value = "$PQWP2 fix-valid field on the RXM-G1 AT port"

[[field_map.sources]]
kind = "f3"
value = "locClnt_StartFix / locPd_ExtEventCb fix-event transition (co-captured QSR4 F3, qdb 77c0963a)"

[[field_map]]
parser_field = "client_id"
quantity = "gnss_firmware_client_magic"
sources = [
    { kind = "trigger", value = "modem-identity: Compal/CEI ⇒ 0x00000DA3" },
]
