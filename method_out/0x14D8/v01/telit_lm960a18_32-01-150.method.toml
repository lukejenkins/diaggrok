version = 1
cond = "sky-fix"
modem_make = "Telit"
modem_model = "LM960A18"
modem_firmware = "32.01.150"

[[field_map]]
parser_field = "engine_state"
quantity = "gnss_engine_fix_state"
status = "refuted"

[[field_map.sources]]
kind = "at"
value = "AT$GPSACP"

[[field_map.sources]]
kind = "nmea"
value = "$GxGGA field 6 (fix quality 0/1/2)"

[[field_map.sources]]
kind = "trigger"
value = "AT$GPSP=0 engine-OFF control vs $GPSP=1 engine-ON — engine_state unchanged (==1) across both"

[[field_map]]
parser_field = "num_engines"
quantity = "num_meas_engines_active"
status = "partial"
sources = [
    { kind = "at", value = "AT$GPSACP" },
    { kind = "nmea", value = "$GxGSA fields 4-15 (SVs used in solution)" },
]

[[field_map]]
parser_field = "fix_flags"
quantity = "fix_validity_flags"
status = "partial"
sources = [
    { kind = "nmea", value = "$GxGGA field 6 (fix quality) + $GxRMC status A/V" },
    { kind = "at", value = "AT$GPSACP" },
]
