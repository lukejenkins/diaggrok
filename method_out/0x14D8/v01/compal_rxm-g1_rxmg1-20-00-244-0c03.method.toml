version = 1
cond = "sky-fix"
modem_make = "Compal"
modem_model = "RXM-G1"
modem_firmware = "RXMG1.20.00.244_0C03"

[[field_map]]
parser_field = "engine_state"
quantity = "gnss_engine_fix_state"

[[field_map.sources]]
kind = "f3"
value = "locClnt_StartFix / locPd_ExtEventCb: Received best available position (co-captured QSR4 F3, qdb 77c0963a) — fix-session state"

[[field_map.sources]]
kind = "nmea"
value = "$PQWP2 fix-valid field on the RXM-G1 if2 AT port (AT+BNMEA=1)"

[[field_map]]
parser_field = "num_engines"
quantity = "num_meas_engines_active"

[[field_map.sources]]
kind = "nmea"
value = "$PQWM1 per-SV measurement rows on the RXM-G1 if2 AT port (count SVs being measured)"

[[field_map.sources]]
kind = "f3"
value = "GNSS measurement-engine F3 round prints (co-captured QSR4, qdb 77c0963a)"

[[field_map]]
parser_field = "field_3_high16"
quantity = "fix_acquisition_burst_family"

[[field_map.sources]]
kind = "trigger"
value = "cold-start drive (clear assistance, no recent fix) to exercise the acquisition burst sequence"

[[field_map.sources]]
kind = "f3"
value = "locClnt_StartFix -> locPd_ExtEventCb fix lifecycle transitions (co-captured QSR4, qdb 77c0963a)"

[[field_map]]
parser_field = "fix_flags"
quantity = "fix_validity_flags"

[[field_map.sources]]
kind = "nmea"
value = "$PQWP2 fix-valid field on the RXM-G1 AT port"

[[field_map.sources]]
kind = "f3"
value = "co-captured QSR4 F3 (qdb 77c0963a) — fix-valid and thermal prints for the bitmask-vs-degC test"
