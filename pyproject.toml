[project]
name = "diaggrok"
version = "2026.10.4"
description = "Qualcomm DIAG log code parser library"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
