[project]
name = "diaggrok"
# Single-sourced from src/diaggrok/_version.py: two hand-bumped copies
# drifted (pyproject 2026.8.5 shipped under public tag v2026.08.23). _version.py
# is also what the carve stamps into EXTRACT_MANIFEST upstream.diaggrok_version.
dynamic = ["version"]
description = "Qualcomm DIAG log code parser library"
license = "Apache-2.0"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Luke Jenkins" }]
keywords = ["diag", "modem", "cellular", "baseband", "lte", "5g"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lukejenkins/diaggrok"
Source = "https://github.com/lukejenkins/diaggrok"
Changelog = "https://github.com/lukejenkins/diaggrok/releases"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "diaggrok._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
